services:
  deliver:
    build: .
    image: deliver:latest
    restart: unless-stopped
    ports:
      - "9209:8080"
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      APP_URL: ${APP_URL:-http://localhost:9209}
    volumes:
      - deliver-data:/data

volumes:
  deliver-data:
